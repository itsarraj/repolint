[package]
name = "repolint"
version = "0.1.0"
edition = "2021"
description = "Audits a repo for real OSS hygiene — a LICENSE whose actual text matches what the manifest declares, a README with recognizable Install/Usage sections, and a CI config"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/repolint"
readme = "README.md"
keywords = ["oss", "license", "readme", "ci", "hygiene"]
categories = ["command-line-utilities"]

[lib]
name = "repolint"
path = "src/lib.rs"

[[bin]]
name = "repolint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
